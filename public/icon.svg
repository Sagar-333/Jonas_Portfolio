<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0c0d14"/>
  <rect width="60" height="60" x="2" y="2" rx="12" fill="none" stroke="#459cce" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Central Racing Star / Clover Emblem in Brand #459cce -->
  <g transform="translate(32, 32) scale(1.1)">
